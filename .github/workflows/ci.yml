name: Umanarayani CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Audit & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword123
          MYSQL_DATABASE: umanarayani_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Test Environment (.env)
        run: |
          cat << 'EOF' > .env
          NODE_ENV=test
          PORT=3000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=testpassword123
          DB_NAME=umanarayani_test
          SESSION_SECRET=test_session_secret_for_ci_pipeline_32chars_long
          OTP_HMAC_SECRET=test_otp_hmac_secret_for_ci_pipeline_32chars
          RESET_TOKEN_SECRET=test_reset_token_secret_for_ci_pipeline_32chars
          HUMAN_VERIFY_SECRET=test_human_verify_secret_for_ci_pipeline_32ch
          ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          SMTP_EMAIL=test@umanarayni.com
          SMTP_PASS=abcdefghijklmnop
          ADMIN_ALERT_EMAIL=test_alert@umanarayni.com
          ADMIN_EMAIL=admin@umanarayni.com,raoa6526@gmail.com,singhpushpendra95734@gmail.com
          ADMIN_EMAILS=admin@umanarayni.com,raoa6526@gmail.com,singhpushpendra95734@gmail.com
          ENABLE_SENTRY=false
          STRUCTURED_LOGS=true
          EOF

      - name: Step 1 - Content Security Policy (CSP) & Lint Audit
        run: npm run lint

      - name: Step 2 - Database Idempotent Migrations
        run: npm run migrate

      - name: Step 2b - Database Initial Catalog Seeding
        run: npm run seed

      - name: Step 3 - Database Pool & Schema Verification
        run: npm run test:db

      - name: Step 4 - Health Check & Request ID Tracking Tests
        run: npm run test:health

      - name: Step 5 - Account Recovery & HMAC OTP Security Tests
        run: node scripts/test-forgot-password.js

      - name: Step 6 - Bot Defense & Turnstile Verification Tests
        run: node scripts/test-turnstile-bypass.js

      - name: Step 7 - Delivery Address & Checkout Snapshot Tests
        run: node scripts/test-address-checkout.js

      - name: Step 8 - Admin Security & TOTP Enforcement Tests
        run: node scripts/test-admin-security.js

      - name: Step 9 - Start Background Express Server & Run Full API Test Suite
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Started Express server with PID: $SERVER_PID"
          
          # Wait for health check readiness probe (up to 30s)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              echo "Server is healthy and ready on port 3000!"
              break
            fi
            echo "Waiting for server to become ready ($i/30)..."
            sleep 1
          done

          # Execute full integration API tests against live server
          npm run test:api

          # Gracefully terminate background server
          kill $SERVER_PID || true
          echo "Background Express server stopped."
