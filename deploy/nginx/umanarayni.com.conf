# ==============================================================================
# UMANARAYNI AYURVEDA — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Location on EC2: /etc/nginx/sites-available/umanarayni.com
# Symlink: /etc/nginx/sites-enabled/umanarayni.com
# ==============================================================================

# Rate Limiting Zone: 30 requests/second per IP with 20MB shared memory zone
limit_req_zone $binary_remote_addr zone=umanarayni_api_limit:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=umanarayni_auth_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80): Let's Encrypt Acme Challenge + HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name umanarayni.com www.umanarayni.com;

    # Allow Let's Encrypt / Certbot domain ownership verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict 301 Permanent Redirect to HTTPS for all incoming web traffic
    location / {
        return 301 https://umanarayni.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Canonical Server Block (Port 443): SSL, HSTS, Reverse Proxy, SSE
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name umanarayni.com www.umanarayni.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/umanarayni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umanarayni.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/umanarayni.com/chain.pem;

    # Modern TLS Security & Recommended Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS: Strict-Transport-Security (2 Years + Preload + Subdomains)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Additional Hardened Edge Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://mercury.phonepe.com')" always;

    # Maximum file upload size (50MB for Ayurvedic formulation demo videos)
    client_max_body_size 50M;

    # Gzip Compression for Fast Storefront Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Media Uploads with Anti-MIME-Sniffing & Script Execution Defense
    location /uploads/ {
        alias /var/www/umanarayni/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # Static Assets (CSS, JS, Images) Cache Policy
    location ~* \.(css|js|jpg|jpeg|png|webp|gif|svg|ico|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Server-Sent Events (SSE) Route: /api/users/stream and real-time streaming
    location /api/users/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical SSE streaming headers: disable proxy buffering and timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Authentication Endpoints Rate-Limiting
    location /api/auth/ {
        limit_req zone=umanarayni_auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Reverse Proxy to Node.js / Express Backend
    location / {
        limit_req zone=umanarayni_api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Reverse Proxy Header Pass-through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
